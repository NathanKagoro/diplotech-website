name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build as published (under /diplotech-website)
        run: npm run build:pages

      - name: Check every link and asset in the export
        run: npm run check

      - name: Screenshots at 1440, 390 and 360 px, plus dialog and form checks
        run: npm run shots
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: error
